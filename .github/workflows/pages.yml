# The site at https://lbd-hackers.github.io/twb/: the data model (`site/`), its reference and the
# validator, and beside them what https://w3id.org/twb sends an RDF client to:
#   /ontology/<file>.ttl     every file of ontology/ (text/turtle)
#   /context/<n>.jsonld      the house file's context, version n (application/ld+json)
name: Pages

on:
    push:
        branches: [main]
        paths: ['ontology/**', 'site/**', 'src/**', '.github/workflows/pages.yml']
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      site/package-lock.json
            - run: npm ci
            - run: npm ci
              working-directory: site
            - run: npm test
              working-directory: site
            - run: npm run build
              working-directory: site
            - run: touch site/dist/.nojekyll
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: site/dist
            - id: deployment
              uses: actions/deploy-pages@v4
