name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    node:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
            - run: npm test
            - run: npm run build

    ontology:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            - run: pip install -r tools/requirements.txt
            - run: python tools/twb_check.py
            - run: python tools/twb_house_check.py
